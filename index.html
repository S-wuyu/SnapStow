<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f9">
  <meta name="description" content="在 Windows 模拟桌面亲手试用圈收 SnapStow，从群聊圈选附件、链接和备注，再到项目箱里找到它们。">
  <title>圈收 SnapStow · 圈一下，松手继续工作</title>
  <link rel="icon" href="./snapstow.png">
  <link rel="stylesheet" href="./style.css?v=source-lens-png">
  <script src="./demo.js?v=source-lens-png" defer></script>
</head>
<body>
  <a class="skip" href="#try">跳到桌面体验</a>
  <main class="shell" aria-label="圈收 SnapStow">
    <section class="desktop" id="try" aria-label="Windows 模拟桌面" tabindex="-1">
      <div class="screen" id="screen">
        <div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>
        <section class="desktop-guide" id="desktop-guide" aria-labelledby="desktop-title">
          <h1 id="desktop-title">圈收 <span lang="en">SnapStow</span></h1>
          <p id="desktop-cue" aria-live="polite">圈一下，松手继续工作。</p>
          <div class="desktop-examples" role="group" aria-label="操作示例">
            <button type="button" class="desktop-action" id="capture" aria-pressed="false" aria-keyshortcuts="Alt+Shift+S">圈选群聊</button>
            <button type="button" class="desktop-action" id="try-queue">拖文件入箱</button>
            <button type="button" class="desktop-action" id="try-archive">打开项目箱</button>
          </div>
        </section>

        <section class="window chat-window" id="chat-window" aria-labelledby="chat-title">
          <header class="chat-chrome">
            <i class="glyph chat-glyph" aria-hidden="true"></i>
            <button type="button" class="icon-control chrome-close" id="min-chat" aria-label="最小化群聊" title="最小化群聊"><span aria-hidden="true">−</span></button>
          </header>
          <div class="chat-layout">
            <div class="channels" role="group" aria-label="群聊列表">
              <button type="button" data-channel="dev" aria-pressed="true" title="支付改版研发群"><span class="avatar" aria-hidden="true">支</span><span>支付改版研发群</span></button>
              <button type="button" data-channel="temp" aria-pressed="false" title="临时会话"><span class="avatar violet" aria-hidden="true">临</span><span>临时会话</span></button>
            </div>
            <div class="conversation">
              <header class="conversation-head"><h2 id="chat-title">支付改版研发群</h2></header>
              <div class="messages" id="messages" aria-label="群聊消息">
                <p class="message-time">10:24</p>
                <div class="message-author"><span class="avatar sender" aria-hidden="true">林</span><span>林一</span></div>
                <div id="message-items" class="message-items"></div>
                <div class="selection-rect" id="selection" aria-hidden="true" hidden><i></i><i></i><i></i><i></i></div>
              </div>
              <form id="chat-form" class="composer">
                <input id="reply" aria-label="发送示例消息" placeholder="发送消息…" maxlength="100" autocomplete="off">
                <button type="submit" class="icon-control send" aria-label="发送" title="发送"><span aria-hidden="true">↑</span></button>
              </form>
            </div>
          </div>
        </section>

        <section class="window workbench" id="workbench" data-theme="dark" aria-label="圈收工作台" hidden>
          <header class="bench-chrome">
            <button type="button" class="bench-brand" id="bench-home" aria-label="圈收工作台首页"><img src="./snapstow.png" width="42" height="42" alt=""><span>圈收<small>SnapStow</small></span></button>
            <div class="bench-tools">
              <button type="button" class="icon-control tool" id="lens" aria-label="放大镜" title="放大镜" aria-pressed="false"><img src="./art/search.svg" alt=""></button>
              <button type="button" class="icon-control tool" id="settings" aria-label="仓库设置" title="仓库设置" aria-pressed="false"><img src="./art/gear.svg" alt=""></button>
              <button type="button" class="icon-control tool" id="min-bench" aria-label="关闭工作台"><img src="./art/close.svg" alt=""></button>
            </div>
          </header>

          <div class="bench-main" id="bench-main">
            <div class="board" id="board">
              <section class="pending" aria-label="待处理文件">
                <button type="button" class="icon-control machine" id="queue-next" aria-label="下一组待处理文件" title="下一组待处理文件"><img src="./art/queue-left.svg" alt=""></button>
                <div class="queue" id="queue"></div>
                <button type="button" class="icon-control machine" id="queue-prev" aria-label="上一组待处理文件" title="上一组待处理文件"><img src="./art/queue-right.svg" alt=""></button>
              </section>
              <section class="belt" id="belt" tabindex="0" aria-label="项目箱传送带，用左右方向键翻页" aria-keyshortcuts="ArrowLeft ArrowRight">
                <div class="belt-bed" aria-hidden="true">
                  <img src="./art/belt-frame.svg" alt="">
                  <div class="rollers"></div>
                  <span class="belt-mark belt-mark-left"></span><span class="belt-mark belt-mark-right"></span>
                </div>
                <div class="boxes" id="boxes"></div>
              </section>
              <div class="drop-bin" id="drop-bin" aria-hidden="true" hidden>
                <img src="./art/drop-bin-closed.svg" alt="">
                <img src="./art/drop-bin-open.svg" alt="">
              </div>
              <div class="association" id="association" hidden aria-hidden="true"></div>
              <button class="icon-control cut" id="cut" type="button" aria-label="剪断同名关联" title="剪断同名关联" draggable="true" hidden><img src="./art/connection-cut.svg" alt=""></button>
            </div>

            <section class="settings-page" id="settings-page" aria-label="仓库设置" hidden>
              <div class="warehouse">
                <img class="warehouse-body" src="./art/warehouse.svg" alt="">
                <img class="warehouse-body light-art" src="./art/warehouse-light.svg" alt="">
                <button type="button" class="warehouse-sign" id="root-picker">工作总目录</button>
                <button type="button" class="warehouse-door" id="warehouse-door" aria-label="抬起卷帘门，返回工作台" title="返回工作台">
                  <img src="./art/warehouse-door.svg" alt=""><img class="light-art" src="./art/warehouse-door-light.svg" alt="">
                </button>
                <button type="button" class="warehouse-shortcut" id="shortcut" aria-label="设置圈选快捷键"></button>
                <button type="button" class="warehouse-theme" id="theme" aria-label="浅色外观" title="切换为浅色外观" aria-pressed="false">
                  <img src="./art/warehouse-theme-dark.svg" alt=""><img class="light-art" src="./art/warehouse-theme-light.svg" alt="">
                </button>
              </div>
            </section>

            <div id="archive-underlay" class="archive-underlay" hidden></div>
            <dialog id="archive" class="archive" aria-labelledby="archive-title">
              <div class="archive-head">
                <h2 id="archive-title"></h2>
                <button type="button" class="icon-control tool" id="archive-lens" aria-label="查看资料来源" title="放大镜" aria-pressed="false"><img src="./art/search.svg" alt=""></button>
                <form method="dialog"><button class="icon-control tool" aria-label="关闭项目箱" autofocus><img src="./art/close.svg" alt=""></button></form>
              </div>
              <div class="archive-content" id="archive-content"></div>
            </dialog>
            <div class="preview-card" id="preview" hidden></div>
          </div>
          <p class="work-status" id="status" role="status" aria-atomic="true"></p>
        </section>
      </div>

      <div class="taskbar">
        <span class="taskbar-menu" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <button type="button" class="icon-control task-app" id="chat-app" aria-label="打开群聊" title="群聊" aria-pressed="true"><i class="glyph chat-glyph" aria-hidden="true"></i></button>
        <div class="tray">
          <button type="button" class="icon-control tray-app" id="tray-app" aria-label="打开圈收工作台" title="打开圈收工作台" aria-expanded="false"><img src="./snapstow.png" width="30" height="30" alt=""></button>
          <span class="tray-system" aria-hidden="true">中 <time>10:24</time></span>
        </div>
      </div>
      <div class="tray-menu" id="tray-menu" aria-label="圈收托盘菜单" hidden>
        <button type="button" id="tray-shortcut">当前快捷键 <span></span></button>
        <button type="button" id="tray-root">项目工作总目录</button>
        <button type="button" id="tray-exit">退出软件</button>
      </div>
      <nav class="desktop-tools" aria-label="演示工具">
        <button type="button" class="icon-control utility" id="reset" aria-label="重置演示" title="重置演示"><i class="reset-glyph" aria-hidden="true"></i></button>
        <a class="icon-control utility" href="https://github.com/S-wuyu/SnapStow" aria-label="GitHub 仓库" title="GitHub 仓库"><img src="./art/github.png" alt=""></a>
      </nav>
    </section>
  </main>

  <dialog id="explorer" class="explorer" aria-labelledby="explorer-title">
    <div class="explorer-head"><h2 id="explorer-title">文件资源管理器</h2><form method="dialog"><button class="icon-control explorer-close" type="submit" aria-label="关闭资源管理器" autofocus><span aria-hidden="true">×</span></button></form></div>
    <p class="path" id="explorer-path"></p>
    <ul id="explorer-list"></ul>
  </dialog>

  <dialog id="choose-root" class="explorer" aria-labelledby="choose-title">
    <div class="explorer-head"><h2 id="choose-title">选择工作总目录</h2><form method="dialog"><button class="icon-control explorer-close" type="submit" aria-label="取消选择目录"><span aria-hidden="true">×</span></button></form></div>
    <form id="root-form" class="root-form">
      <label for="root-choice">示例目录</label>
      <select id="root-choice"><option>D:\项目仓库</option><option>D:\工作\归档</option><option>E:\团队资料</option></select>
      <button type="submit" autofocus>选择文件夹</button>
    </form>
  </dialog>
</body>
</html>
